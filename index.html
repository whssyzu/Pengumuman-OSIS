<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- TAG UTAMA AGAR UKURAN MENYESUAIKAN SCREEN HP & PC -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumuman Hasil Seleksi OSIS & MPK</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body { 
      font-family: Arial, sans-serif; 
      background-color: #f4f6f9; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      min-height: 100vh;
      padding: 15px; 
    }
    .card { 
      background: white; 
      border-radius: 12px; 
      width: 100%; 
      max-width: 450px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
      overflow: hidden; 
    }
    .header { 
      background: #0d47a1; 
      color: white; 
      padding: 18px 15px; 
      text-align: center; 
    }
    .header h3 {
      font-size: 1.1rem;
      line-height: 1.3;
    }
    .content { 
      padding: 20px; 
      text-align: center; 
    }
    .status-pass { 
      background-color: #2e7d32; 
      color: white; 
      padding: 15px; 
      border-radius: 6px; 
      font-weight: bold; 
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .status-fail { 
      background-color: #c62828; 
      color: white; 
      padding: 15px; 
      border-radius: 6px; 
      font-weight: bold; 
      font-size: 0.95rem;
      line-height: 1.4;
    }
    input, button { 
      width: 100%; 
      padding: 12px; 
      margin-top: 12px; 
      border-radius: 6px; 
      border: 1px solid #ccc; 
      font-size: 1rem;
    }
    button { 
      background-color: #1976d2; 
      color: white; 
      border: none; 
      font-weight: bold; 
      cursor: pointer; 
    }
    button:active {
      background-color: #1565c0;
    }
    .timer-display { 
      font-size: 1.3rem; 
      font-weight: bold; 
      color: #0d47a1; 
      margin: 15px 0; 
      background: #e3f2fd; 
      padding: 12px; 
      border-radius: 6px; 
    }
    .hidden { display: none; }

    /* PENYESUAIAN TAMPAKAN HP */
    @media (max-width: 480px) {
      body {
        padding: 10px;
      }
      .content {
        padding: 15px;
      }
      .header h3 {
        font-size: 1rem;
      }
      .timer-display {
        font-size: 1.1rem;
      }
    }
  </style>
</head>

    <h3>PENGUMUMAN SELEKSI OSIS & MPK 2026/2027</h3>
  </div>
  <div class="content">

    <!-- TAMPILAN TIMER -->
    <div id="timer-section">
      <p style="font-size: 14px; color: #555;">Pengumuman akan dibuka dalam:</p>
      <div id="timer" class="timer-display">00h 00j 00m 00d</div>
      <p style="font-size: 12px; color: #888;">Silakan tunggu hingga hitungan mundur selesai.</p>
    </div>

    <!-- TAMPILAN FORM -->
    <div id="form-section" class="hidden">
      <label for="nisn" style="text-align: left; display: block; font-size: 0.9rem; font-weight: bold; color: #333;">
        Masukkan Nomor Pendaftaran / Nama Peserta:
      </label>
      <input type="text" id="nisn" placeholder="Contoh: 10 atau Alexander Idan">
      <button onclick="cekHasil()">LIHAT HASIL SELEKSI</button>
    </div>

    <!-- TAMPILAN HASIL -->
    <div id="result-section" class="hidden" style="text-align: left;">
      <div id="status-box"></div>
      <div style="margin-top: 15px; line-height: 1.6;" id="user-details"></div>
      <button onclick="resetForm()" style="background-color: #757575;">Kembali</button>
    </div>

  </div>

    const sekarang = new Date().getTime();
    const selisih = tanggalBuka - sekarang;

    if (selisih <= 0) {
      clearInterval(countdown);
      document.getElementById("timer-section").classList.add("hidden");
      document.getElementById("form-section").classList.remove("hidden");
    } else {
      const hari = Math.floor(selisih / (1000 * 60 * 60 * 24));
      const jam = Math.floor((selisih % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const menit = Math.floor((selisih % (1000 * 60 * 60)) / (1000 * 60));
      const detik = Math.floor((selisih % (1000 * 60)) / 1000);

      document.getElementById("timer").innerText = 
        `${hari}h ${jam}j ${menit}m ${detik}d`;
    }

  // 3. LOGIKA CEK HASIL SELEKSI
  function cekHasil() {
    const input = document.getElementById("nisn").value.trim().toLowerCase();
    const resultSection = document.getElementById("result-section");
    const formSection = document.getElementById("form-section");
    const statusBox = document.getElementById("status-box");
    const userDetails = document.getElementById("user-details");

    if (!input) {
      alert("Silakan masukkan Nomor Pendaftaran atau Nama terlebih dahulu!");
      return;
    }

    let peserta = dataPeserta[input];
    if (!peserta) {
      const foundKey = Object.keys(dataPeserta).find(k => 
        dataPeserta[k].nama.toLowerCase().includes(input)
      );
      if (foundKey) peserta = dataPeserta[foundKey];
    }

    if (peserta) {
      formSection.classList.add("hidden");
      resultSection.classList.remove("hidden");

      if (peserta.status === "LOLOS") {
        statusBox.className = "status-pass";
        statusBox.innerText = `SELAMAT! ANDA DINYATAKAN LOLOS SELEKSI CALON PENGURUS ${peserta.organisasi}`;
        userDetails.innerHTML = `
          <p><b>Nama:</b> ${peserta.nama}</p>
          <p><b>Kelas:</b> ${peserta.kelas}</p>
          <p><b>Peringkat:</b> ${peserta.noAbsen}</p>
          <p><b>Diterima di:</b> ${peserta.organisasi}</p>
        `;
      } else {
        statusBox.className = "status-fail";
        statusBox.innerText = "MOHON MAAF, ANDA DINYATAKAN TIDAK LOLOS SELEKSI";
        userDetails.innerHTML = `
          <p><b>Nama:</b> ${peserta.nama}</p>
          <p><b>Kelas:</b> ${peserta.kelas}</p>
          <p><b>Pilihan Organisasi:</b> ${peserta.organisasi}</p>
          <p style="margin-top: 10px; color: #555;">Tetap semangat dan terima kasih telah berpartisipasi!</p>
        `;
      }
    } else {
      alert("Nomor Pendaftaran atau Nama tidak ditemukan! Periksa kembali kata kunci yang Anda masukkan.");
    }
  }

  function resetForm() {
    document.getElementById("form-section").classList.remove("hidden");
    document.getElementById("result-section").classList.add("hidden");
    document.getElementById("nisn").value = "";
